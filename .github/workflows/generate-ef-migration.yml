name: Generate EF Core Migration

on:
  push:
    branches: [feat/opd-billing-foundation]
  workflow_dispatch:
    inputs:
      migration_name:
        description: "PascalCase EF migration name, e.g. AddPatientIdentifiers"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ef-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-commit:
    if: github.ref == 'refs/heads/feat/opd-billing-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compilecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compilecare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__CompileCareTests: Host=localhost;Port=5432;Database=compilecare_test;Username=postgres;Password=postgres
    steps:
      - name: Validate target branch and migration name
        shell: bash
        env:
          MIGRATION_NAME: ${{ inputs.migration_name || 'AlignOpdBillingModelSnapshot' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/opd-billing-foundation"
          if [[ ! "$MIGRATION_NAME" =~ ^[A-Z][A-Za-z0-9]*$ ]]; then
            echo "::error::Migration name must be PascalCase alphanumeric and start with an uppercase letter."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Packages credentials
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore solution and tools
        run: |
          dotnet restore CompileCare.Api.slnx
          dotnet tool restore

      - name: Generate migration from the committed EF model
        shell: bash
        env:
          MIGRATION_NAME: ${{ inputs.migration_name || 'AlignOpdBillingModelSnapshot' }}
        run: |
          dotnet ef migrations add "$MIGRATION_NAME" \
            --project src/CompileCare.Infrastructure \
            --startup-project src/CompileCare.Api \
            --context CompileCareDbContext \
            --output-dir Persistence/Migrations

      - name: Preserve the manually authored billing migration target-model helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/CompileCare.Infrastructure/Persistence/Migrations/CompileCareDbContextModelSnapshot.cs")
          content = path.read_text(encoding="utf-8-sig")
          marker = "        protected override void BuildModel(ModelBuilder modelBuilder)"
          helper = "        internal static void BuildModelForMigration(ModelBuilder modelBuilder) =>\n            new CompileCareDbContextModelSnapshot().BuildModel(modelBuilder);\n\n"
          if "BuildModelForMigration" not in content:
              if marker not in content:
                  raise SystemExit("Could not locate snapshot BuildModel method.")
              content = content.replace(marker, helper + marker, 1)
              path.write_text(content, encoding="utf-8-sig")
          PY

      - name: Ensure migration ID follows existing migration history
        shell: bash
        env:
          MIGRATION_NAME: ${{ inputs.migration_name || 'AlignOpdBillingModelSnapshot' }}
        run: |
          set -euo pipefail
          migration_dir="src/CompileCare.Infrastructure/Persistence/Migrations"
          generated_file="$(find "$migration_dir" -maxdepth 1 -type f -name "*_$MIGRATION_NAME.cs" ! -name "*.Designer.cs" -print -quit)"
          if [[ -z "$generated_file" ]]; then
            echo "::error::Generated migration source file was not found."
            exit 1
          fi

          generated_id="$(basename "$generated_file" .cs | cut -d_ -f1)"
          latest_id="$(find "$migration_dir" -maxdepth 1 -type f -name "*.cs" ! -name "*.Designer.cs" -printf '%f\n' | sed -nE 's/^([0-9]{14})_.+\.cs$/\1/p' | sort | tail -n 1)"
          if [[ -n "$latest_id" && "$generated_id" < "$latest_id" || "$generated_id" == "$latest_id" ]]; then
            latest_epoch="$(python -c "from datetime import datetime; print(int(datetime.strptime('$latest_id', '%Y%m%d%H%M%S').timestamp()))")"
            next_id="$(python -c "from datetime import datetime, timezone; import sys; print(datetime.fromtimestamp(int(sys.argv[1]) + 1, timezone.utc).strftime('%Y%m%d%H%M%S'))" "$latest_epoch")"
            old_base="$(basename "$generated_file" .cs)"
            new_base="${next_id}_${MIGRATION_NAME}"
            designer_file="$migration_dir/$old_base.Designer.cs"
            mv "$generated_file" "$migration_dir/$new_base.cs"
            mv "$designer_file" "$migration_dir/$new_base.Designer.cs"
            sed -i "s/$old_base/$new_base/g" "$migration_dir/$new_base.Designer.cs"
          fi

      - name: Inspect generated migration operations
        shell: bash
        env:
          MIGRATION_NAME: ${{ inputs.migration_name || 'AlignOpdBillingModelSnapshot' }}
        run: |
          set -euo pipefail
          generated_file="$(find src/CompileCare.Infrastructure/Persistence/Migrations -maxdepth 1 -type f -name "*_$MIGRATION_NAME.cs" ! -name "*.Designer.cs" -print -quit)"
          echo "Generated migration: $generated_file"
          cat "$generated_file"

      - name: Build solution
        run: dotnet build CompileCare.Api.slnx --configuration Release --no-restore

      - name: Verify EF model and migration snapshot are aligned
        run: dotnet ef migrations has-pending-model-changes --project src/CompileCare.Infrastructure --startup-project src/CompileCare.Api --context CompileCareDbContext

      - name: Run integration and unit tests
        run: dotnet test CompileCare.Api.slnx --configuration Release --no-build

      - name: Commit and push generated migration
        shell: bash
        env:
          MIGRATION_NAME: ${{ inputs.migration_name || 'AlignOpdBillingModelSnapshot' }}
        run: |
          set -euo pipefail
          migration_dir="src/CompileCare.Infrastructure/Persistence/Migrations"
          if [[ -z "$(git status --porcelain -- "$migration_dir")" ]]; then
            echo "::error::EF tooling produced no migration changes; refusing to create an empty commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$migration_dir"
          git commit -m "chore(database): add $MIGRATION_NAME migration"
          git push origin "HEAD:$GITHUB_REF_NAME"
