name: Generate EF Core Migration

on:
  workflow_dispatch:
    inputs:
      migration_name:
        description: "PascalCase EF migration name, e.g. AddPatientRegistration"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ef-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-commit:
    if: github.ref == 'refs/heads/feature/patient-master-registration-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compilecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compilecare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__CompileCareTests: Host=localhost;Port=5432;Database=compilecare_test;Username=postgres;Password=postgres
    steps:
      - name: Validate target branch and migration name
        shell: bash
        env:
          MIGRATION_NAME: ${{ inputs.migration_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/patient-master-registration-foundation"
          if [[ ! "$MIGRATION_NAME" =~ ^[A-Z][A-Za-z0-9]*$ ]]; then
            echo "::error::Migration name must be PascalCase alphanumeric and start with an uppercase letter."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Packages credentials
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore solution and tools
        run: |
          dotnet restore CompileCare.Api.slnx
          dotnet tool restore

      - name: Generate migration from the committed EF model
        shell: bash
        env:
          MIGRATION_NAME: ${{ inputs.migration_name }}
        run: |
          dotnet ef migrations add "$MIGRATION_NAME" \
            --project src/CompileCare.Infrastructure \
            --startup-project src/CompileCare.Api \
            --context CompileCareDbContext \
            --output-dir Persistence/Migrations

      - name: Build solution
        run: dotnet build CompileCare.Api.slnx --configuration Release --no-restore

      - name: Verify EF model and migration snapshot are aligned
        run: dotnet ef migrations has-pending-model-changes --project src/CompileCare.Infrastructure --startup-project src/CompileCare.Api --context CompileCareDbContext

      - name: Run integration and unit tests
        run: dotnet test CompileCare.Api.slnx --configuration Release --no-build

      - name: Commit and push generated migration
        shell: bash
        env:
          MIGRATION_NAME: ${{ inputs.migration_name }}
        run: |
          set -euo pipefail
          MIGRATION_DIR="src/CompileCare.Infrastructure/Persistence/Migrations"
          if [[ -z "$(git status --porcelain -- "$MIGRATION_DIR")" ]]; then
            echo "::error::EF tooling produced no migration changes; refusing to create an empty commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MIGRATION_DIR"
          git commit -m "chore(database): add ${MIGRATION_NAME} migration"
          git push origin "HEAD:$GITHUB_REF_NAME"
