name: Diagnose EF Model Drift

on:
  push:
    branches:
      - feat/appointment-checkin-queue-lifecycle
    paths:
      - ".github/workflows/diagnose-ef-model-drift.yml"

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Configure GitHub Packages credentials
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet restore CompileCare.Api.slnx
      - run: dotnet tool restore
      - name: Reproduce pending model check
        continue-on-error: true
        run: dotnet ef migrations has-pending-model-changes --project src/CompileCare.Infrastructure --startup-project src/CompileCare.Api --context CompileCareDbContext
      - name: Scaffold diagnostic migration without committing
        run: dotnet ef migrations add DiagnoseModelDrift --project src/CompileCare.Infrastructure --startup-project src/CompileCare.Api --context CompileCareDbContext --output-dir Persistence/Migrations
      - name: Print exact generated model diff
        run: |
          git diff -- src/CompileCare.Infrastructure/Persistence/Migrations/CompileCareDbContextModelSnapshot.cs
          find src/CompileCare.Infrastructure/Persistence/Migrations -maxdepth 1 -type f -name '*DiagnoseModelDrift*' -print -exec cat {} ;
