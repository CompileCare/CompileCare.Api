name: Diagnose OPD EF Model Drift

on:
  push:
    branches:
      - feat/opd-encounter-foundation
    paths:
      - ".github/workflows/diagnose-opd-model-drift.yml"

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Configure GitHub Packages credentials
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet restore CompileCare.Api.slnx
      - run: dotnet tool restore
      - name: Scaffold diagnostic migration without committing
        run: dotnet ef migrations add DiagnoseOpdModelDrift --project src/CompileCare.Infrastructure --startup-project src/CompileCare.Api --context CompileCareDbContext --output-dir Persistence/Migrations
      - name: Print generated model changes
        run: |
          git diff -- src/CompileCare.Infrastructure/Persistence/Migrations/CompileCareDbContextModelSnapshot.cs || true
          find src/CompileCare.Infrastructure/Persistence/Migrations -maxdepth 1 -type f -name '*DiagnoseOpdModelDrift.cs' -print -exec cat {} \;
