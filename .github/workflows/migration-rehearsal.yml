name: PostgreSQL Migration Rehearsal

on:
  pull_request:
    paths:
      - "src/HeapCare.Infrastructure/**"
      - "src/HeapCare.Api/**"
      - ".github/workflows/migration-rehearsal.yml"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.Config"
      - "global.json"

permissions:
  contents: read

concurrency:
  group: migration-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ConnectionStrings__HeapCareTests: Host=localhost;Port=5432;Database=heapcare_upgrade;Username=postgres;Password=postgres
      ConnectionStrings__CompileCareTests: Host=localhost;Port=5432;Database=heapcare_upgrade;Username=postgres;Password=postgres
      ConnectionStrings__HeapCare: Host=localhost;Port=5432;Database=heapcare_upgrade;Username=postgres;Password=postgres
      ConnectionStrings__CompileCare: Host=localhost;Port=5432;Database=heapcare_upgrade;Username=postgres;Password=postgres
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: HeapCare/HeapCare.Observability
          ref: main
          path: HeapCare.Observability

      - uses: actions/checkout@v4
        with:
          repository: HeapCare/HeapCare.Observability
          ref: 935f6629d5abb92296385ec2e0c1ec04060b3fb7
          path: CompileCare.Observability.Legacy

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pin compatible SDK for shared package builds
        run: |
          echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature"}}' > HeapCare.Observability/global.json
          echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature"}}' > CompileCare.Observability.Legacy/global.json
      - name: Pack HeapCare observability packages for the PR revision
        working-directory: HeapCare.Observability
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-nuget"
          # The PR revision consumes Observability 1.0.2; the base API revision still consumes 1.0.1.
          dotnet pack src/HeapCare.Observability/HeapCare.Observability.csproj --configuration Release -p:Version=1.0.2 -p:ManagePackageVersionsCentrally=false -p:NoWarn=NU5104 -o "$GITHUB_WORKSPACE/.ci-nuget"
          dotnet pack src/HeapCare.Observability.AspNetCore/HeapCare.Observability.AspNetCore.csproj --configuration Release -p:Version=1.0.2 -p:ManagePackageVersionsCentrally=false -p:NoWarn=NU5104 -o "$GITHUB_WORKSPACE/.ci-nuget"
          dotnet pack src/HeapCare.Observability/HeapCare.Observability.csproj --configuration Release -p:Version=1.0.1 -p:ManagePackageVersionsCentrally=false -p:NoWarn=NU5104 -o "$GITHUB_WORKSPACE/.ci-nuget"
          dotnet pack src/HeapCare.Observability.AspNetCore/HeapCare.Observability.AspNetCore.csproj --configuration Release -p:Version=1.0.1 -p:ManagePackageVersionsCentrally=false -p:NoWarn=NU5104 -o "$GITHUB_WORKSPACE/.ci-nuget"
          cat > "$GITHUB_WORKSPACE/.ci-nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="heapcare-ci" value="$GITHUB_WORKSPACE/.ci-nuget" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="heapcare-ci">
                <package pattern="HeapCare.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - name: Pack legacy CompileCare observability packages for the base revision
        working-directory: CompileCare.Observability.Legacy
        run: |
          dotnet pack src/CompileCare.Observability/CompileCare.Observability.csproj --configuration Release -p:Version=1.0.1 -p:ManagePackageVersionsCentrally=false -p:NoWarn=NU5104 -o "$GITHUB_WORKSPACE/.ci-nuget"
          dotnet pack src/CompileCare.Observability.AspNetCore/CompileCare.Observability.AspNetCore.csproj --configuration Release -p:Version=1.0.1 -p:ManagePackageVersionsCentrally=false -p:NoWarn=NU5104 -o "$GITHUB_WORKSPACE/.ci-nuget"
          cat > "$GITHUB_WORKSPACE/.legacy-nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="legacy-ci" value="$GITHUB_WORKSPACE/.ci-nuget" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="legacy-ci"><package pattern="CompileCare.*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare isolated PostgreSQL databases
        run: |
          set -euo pipefail
          createdb --host=localhost --username=postgres heapcare_upgrade
          createdb --host=localhost --username=postgres heapcare_fresh

      - name: Check out the base migration model
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA"
          git worktree add /tmp/heapcare-base "$BASE_SHA"
          if [[ -f /tmp/heapcare-base/HeapCare.Api.slnx ]]; then
            cp "$GITHUB_WORKSPACE/.ci-nuget.config" /tmp/heapcare-base/NuGet.Config
          else
            cp "$GITHUB_WORKSPACE/.legacy-nuget.config" /tmp/heapcare-base/NuGet.Config
          fi

      - name: Restore and build base revision
        working-directory: /tmp/heapcare-base
        run: |
          if [[ -f HeapCare.Api.slnx ]]; then
            dotnet restore HeapCare.Api.slnx --configfile NuGet.Config
            dotnet tool restore --configfile NuGet.Config
            dotnet build HeapCare.Api.slnx --configuration Release --no-restore
          else
            dotnet restore CompileCare.Api.slnx --configfile NuGet.Config
            dotnet tool restore --configfile NuGet.Config
            dotnet build CompileCare.Api.slnx --configuration Release --no-restore
          fi

      - name: Apply base migrations to the upgrade database
        working-directory: /tmp/heapcare-base
        run: |
          if [[ -f HeapCare.Api.slnx ]]; then
            dotnet ef database update \
              --project src/HeapCare.Infrastructure \
              --startup-project src/HeapCare.Api \
              --context HeapCareDbContext
          else
            dotnet ef database update \
              --project src/CompileCare.Infrastructure \
              --startup-project src/CompileCare.Api \
              --context CompileCareDbContext
          fi

      - name: Restore and build pull request revision
        run: |
          dotnet restore HeapCare.Api.slnx --configfile .ci-nuget.config
          dotnet tool restore --configfile .ci-nuget.config
          dotnet build HeapCare.Api.slnx --configuration Release --no-restore

      - name: Generate idempotent migration script from pull request revision
        run: |
          dotnet ef migrations script --idempotent \
            --project src/HeapCare.Infrastructure \
            --startup-project src/HeapCare.Api \
            --context HeapCareDbContext \
            --output /tmp/heapcare-current-migrations.sql

      - name: Rehearse upgrade and fresh-database installation
        run: |
          set -euo pipefail
          for database in heapcare_upgrade heapcare_fresh; do
            connection="postgresql://postgres:postgres@localhost:5432/$database"
            psql "$connection" --set ON_ERROR_STOP=1 --file=/tmp/heapcare-current-migrations.sql
            # Reapply the idempotent script to prove it safely handles an already-current schema.
            psql "$connection" --set ON_ERROR_STOP=1 --file=/tmp/heapcare-current-migrations.sql
          done
          upgrade_ids=$(psql -X -qAt "postgresql://postgres:postgres@localhost:5432/heapcare_upgrade" \
            --command='SELECT string_agg("MigrationId", chr(44) ORDER BY "MigrationId") FROM "__EFMigrationsHistory";')
          fresh_ids=$(psql -X -qAt "postgresql://postgres:postgres@localhost:5432/heapcare_fresh" \
            --command='SELECT string_agg("MigrationId", chr(44) ORDER BY "MigrationId") FROM "__EFMigrationsHistory";')
          if [[ -z "$upgrade_ids" || -z "$fresh_ids" ]]; then
            echo "::error::EF migration history was not populated in both rehearsal databases."
            exit 1
          fi
          if [[ "$upgrade_ids" != "$fresh_ids" ]]; then
            echo "::error::Upgrade and fresh databases have different migration histories."
            echo "Upgrade: $upgrade_ids"
            echo "Fresh:   $fresh_ids"
            exit 1
          fi
          echo "Upgrade rehearsal and fresh install both applied the same migration history."

      - name: Capture PostgreSQL logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs "$(docker ps -q --filter ancestor=postgres:16 | head -n 1)" || true
