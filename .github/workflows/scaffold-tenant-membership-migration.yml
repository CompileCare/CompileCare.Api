name: Scaffold tenant membership EF migration

on:
  push:
    branches:
      - feature/phase3-identity-rbac
    paths-ignore:
      - 'src/CompileCare.Infrastructure/Persistence/Migrations/**'

permissions:
  contents: write
  packages: read

jobs:
  scaffold-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Configure GitHub Packages credentials
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore, build and restore local tools
        run: |
          dotnet restore CompileCare.Api.slnx
          dotnet build CompileCare.Api.slnx --configuration Release --no-restore
          dotnet tool restore
      - name: Scaffold tenant membership migration
        run: |
          dotnet ef migrations add AddTenantMemberships \
            --project src/CompileCare.Infrastructure \
            --startup-project src/CompileCare.Api \
            --output-dir Persistence/Migrations
      - name: Commit generated migration and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CompileCare.Infrastructure/Persistence/Migrations
          git commit -m "feat(db): add tenant membership migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
