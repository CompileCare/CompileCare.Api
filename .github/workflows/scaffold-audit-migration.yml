name: Scaffold audit event migration

on:
  push:
    branches:
      - feature/phase3-audit-events

permissions:
  contents: write
  packages: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Configure GitHub Packages credentials
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether migration already exists
        id: migration
        shell: bash
        run: |
          if compgen -G "src/CompileCare.Infrastructure/Persistence/Migrations/*_AddAuditEvents.cs" > /dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore and build
        if: steps.migration.outputs.needed == 'true'
        run: |
          dotnet restore CompileCare.Api.slnx
          dotnet build CompileCare.Api.slnx --configuration Release --no-restore
      - name: Restore .NET tools
        if: steps.migration.outputs.needed == 'true'
        run: dotnet tool restore
      - name: Scaffold audit migration
        if: steps.migration.outputs.needed == 'true'
        run: |
          dotnet ef migrations add AddAuditEvents \
            --project src/CompileCare.Infrastructure \
            --startup-project src/CompileCare.Api \
            --output-dir Persistence/Migrations
      - name: Upload generated migration source
        if: steps.migration.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: audit-event-migration-draft
          path: src/CompileCare.Infrastructure/Persistence/Migrations/*.cs
          if-no-files-found: error
          retention-days: 3
      - name: Commit generated migration
        if: steps.migration.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CompileCare.Infrastructure/Persistence/Migrations
          git commit -m "feat(db): scaffold append-only audit event migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
