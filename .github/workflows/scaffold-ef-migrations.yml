name: Generate reviewed EF Core migration draft

on:
  push:
    branches:
      - feature/phase3-database-security

permissions:
  contents: write
  packages: read
  actions: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Configure GitHub Packages credentials
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and build
        run: |
          dotnet restore CompileCare.Api.slnx
          dotnet build CompileCare.Api.slnx --configuration Release --no-restore
      - name: Install EF Core tooling
        run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Scaffold initial facility migration
        run: |
          dotnet ef migrations add InitialFacilityHierarchy             --project src/CompileCare.Infrastructure             --startup-project src/CompileCare.Api             --output-dir Persistence/Migrations
      - name: Upload generated migration source
        uses: actions/upload-artifact@v4
        with:
          name: ef-core-migration-draft
          path: src/CompileCare.Infrastructure/Persistence/Migrations/*.cs
          if-no-files-found: error
          retention-days: 3
      - name: Commit scaffolded migration to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CompileCare.Infrastructure/Persistence/Migrations
          git commit -m "feat(db): scaffold initial facility hierarchy migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
