name: CI
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compilecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compilecare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__HeapCareTests: Host=localhost;Port=5432;Database=compilecare_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HeapCare/HeapCare.Observability
          ref: main
          path: HeapCare.Observability
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pin compatible .NET SDK for shared observability build
        run: echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature"}}' > HeapCare.Observability/global.json
      - name: Pack HeapCare observability packages into an ephemeral feed
        working-directory: HeapCare.Observability
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-nuget"
          dotnet pack src/HeapCare.Observability/HeapCare.Observability.csproj --configuration Release -p:Version=1.0.2 -p:ManagePackageVersionsCentrally=false -p:NoWarn=NU5104 -o "$GITHUB_WORKSPACE/.ci-nuget"
          dotnet pack src/HeapCare.Observability.AspNetCore/HeapCare.Observability.AspNetCore.csproj --configuration Release -p:Version=1.0.2 -p:ManagePackageVersionsCentrally=false -p:NoWarn=NU5104 -o "$GITHUB_WORKSPACE/.ci-nuget"
          cat > "$GITHUB_WORKSPACE/.ci-nuget.config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="heapcare-ci" value=".ci-nuget" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="heapcare-ci">
                <package pattern="HeapCare.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HeapCare.Api.slnx --configfile .ci-nuget.config
      - run: dotnet build HeapCare.Api.slnx --configuration Release --no-restore
      - name: TEMP diagnose IPD EF model snapshot drift
        if: github.ref == 'refs/heads/feature/ipd-admission-bed-placement-foundation'
        run: |
          dotnet ef migrations add DiagnoseIpdSnapshot --project src/HeapCare.Infrastructure --startup-project src/HeapCare.Api --output-dir Persistence/Migrations
          echo "=== GENERATED MIGRATION ==="
          generated="$(find src/HeapCare.Infrastructure/Persistence/Migrations -maxdepth 1 -name '*_DiagnoseIpdSnapshot.cs' -print -quit)"
          cat "$generated"
          echo "=== SNAPSHOT DIFF ==="
          git --no-pager diff -- src/HeapCare.Infrastructure/Persistence/Migrations/HeapCareDbContextModelSnapshot.cs
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Detect pending EF Core model changes
        run: dotnet ef migrations has-pending-model-changes --project src/HeapCare.Infrastructure --startup-project src/HeapCare.Api
      - run: dotnet test HeapCare.Api.slnx --configuration Release --no-build
