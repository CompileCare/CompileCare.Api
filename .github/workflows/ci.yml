name: CI
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compilecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compilecare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__CompileCareTests: Host=localhost;Port=5432;Database=compilecare_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Configure GitHub Packages credentials
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet restore CompileCare.Api.slnx
      - run: dotnet build CompileCare.Api.slnx --configuration Release --no-restore
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Detect pending EF Core model changes
        run: dotnet ef migrations has-pending-model-changes --project src/CompileCare.Infrastructure --startup-project src/CompileCare.Api
      - run: dotnet test CompileCare.Api.slnx --configuration Release --no-build

  heapcare-identifier-migration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/migration/heapcare-branding'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/heapcare-branding
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rename HeapCare source identifiers and paths
        run: python3 scripts/heapcare-migrate-identifiers.py
      - name: Commit migration changes
        run: |
          if git diff --quiet; then
            echo "No remaining PascalCase identifiers or paths to migrate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: migrate API source identifiers to HeapCare"
          git push origin HEAD:migration/heapcare-technical
