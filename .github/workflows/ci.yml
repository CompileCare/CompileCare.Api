name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore CompileCare.Api.slnx
      - run: dotnet build CompileCare.Api.slnx --configuration Release --no-restore
      - run: dotnet test CompileCare.Api.slnx --configuration Release --no-build
