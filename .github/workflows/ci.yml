name: CI
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compilecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compilecare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__CompileCareTests: Host=localhost;Port=5432;Database=compilecare_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Configure GitHub Packages credentials
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet restore CompileCare.Api.slnx
      - run: dotnet build CompileCare.Api.slnx --configuration Release --no-restore
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Detect pending EF Core model changes
        run: dotnet ef migrations has-pending-model-changes --project src/CompileCare.Infrastructure --startup-project src/CompileCare.Api
      - run: dotnet test CompileCare.Api.slnx --configuration Release --no-build
      - name: Build production API container with BuildKit secret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'Username=%s;Password=%s;ValidAuthenticationTypes=Basic' "$GITHUB_ACTOR" "$GITHUB_TOKEN" > "$RUNNER_TEMP/nuget-source-credentials"
          docker build --secret id=nuget_credentials,src="$RUNNER_TEMP/nuget-source-credentials" --tag compilecare-api:ci .
          rm -f "$RUNNER_TEMP/nuget-source-credentials"
      - name: Validate local launcher scripts and Compose configuration
        shell: bash
        run: |
          bash -n local/scripts/start-macos.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("local/scripts/start-windows.ps1", [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          mkdir -p local/.secrets "$RUNNER_TEMP/CompileCare.Web"
          printf 'Username=ci;Password=placeholder;ValidAuthenticationTypes=Basic' > local/.secrets/nuget-source-credentials
          COMPILECARE_WEB_PATH="$RUNNER_TEMP/CompileCare.Web" docker compose --env-file local/.env.example -f local/docker-compose.yml config --quiet
          rm -rf local/.secrets
