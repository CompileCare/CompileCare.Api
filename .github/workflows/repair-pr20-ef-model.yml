name: Repair PR 20 EF Model Snapshot

on:
  push:
    branches:
      - feat/appointment-checkin-queue-lifecycle
    paths:
      - .github/workflows/repair-pr20-ef-model.yml

permissions:
  contents: read
  packages: read

jobs:
  generate-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compilecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compilecare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__CompileCareTests: Host=localhost;Port=5432;Database=compilecare_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Packages credentials
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore solution and tools
        run: |
          dotnet restore CompileCare.Api.slnx
          dotnet tool restore

      - name: Generate migration from the actual EF model
        run: |
          dotnet ef migrations add AlignFrontDeskQueueModel             --project src/CompileCare.Infrastructure             --startup-project src/CompileCare.Api             --context CompileCareDbContext             --output-dir Persistence/Migrations

      - name: Ensure generated migration follows existing history
        shell: bash
        run: |
          set -euo pipefail
          migration_dir="src/CompileCare.Infrastructure/Persistence/Migrations"
          generated_file="$(find "$migration_dir" -maxdepth 1 -type f -name "*_AlignFrontDeskQueueModel.cs" ! -name "*.Designer.cs" -print -quit)"
          test -n "$generated_file"
          generated_id="$(basename "$generated_file" .cs | cut -d_ -f1)"
          latest_id="$(find "$migration_dir" -maxdepth 1 -type f -name "*.cs" ! -name "*.Designer.cs" -printf '%f\n' | sed -nE 's/^([0-9]{14})_.+\.cs$/\1/p' | sort | tail -n 1)"
          if [[ -n "$latest_id" && "$generated_id" < "$latest_id" || "$generated_id" == "$latest_id" ]]; then
            latest_epoch="$(python -c "from datetime import datetime; print(int(datetime.strptime('$latest_id', '%Y%m%d%H%M%S').timestamp()))")"
            next_id="$(python -c "from datetime import datetime, timezone; import sys; print(datetime.fromtimestamp(int(sys.argv[1]) + 1, timezone.utc).strftime('%Y%m%d%H%M%S'))" "$latest_epoch")"
            old_base="$(basename "$generated_file" .cs)"
            new_base="${next_id}_AlignFrontDeskQueueModel"
            mv "$generated_file" "$migration_dir/$new_base.cs"
            mv "$migration_dir/$old_base.Designer.cs" "$migration_dir/$new_base.Designer.cs"
            sed -i "s/$old_base/$new_base/g" "$migration_dir/$new_base.Designer.cs"
          fi

      - name: Build solution
        run: dotnet build CompileCare.Api.slnx --configuration Release --no-restore

      - name: Verify model and snapshot alignment
        run: dotnet ef migrations has-pending-model-changes --project src/CompileCare.Infrastructure --startup-project src/CompileCare.Api --context CompileCareDbContext

      - name: Run unit and PostgreSQL integration tests
        run: dotnet test CompileCare.Api.slnx --configuration Release --no-build

      - name: Commit generated migration and snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CompileCare.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration changes were generated."
            exit 1
          fi
          git commit -m "chore(database): align front desk queue EF model snapshot"
          git push origin HEAD:feat/appointment-checkin-queue-lifecycle
