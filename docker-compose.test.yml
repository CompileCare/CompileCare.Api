services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: heapcare_test
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - heapcare-test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heapcare_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      ConnectionStrings__HeapCareTests: Host=postgres;Port=5432;Database=heapcare_test;Username=postgres;Password=postgres
      GITHUB_ACTOR: ${GITHUB_ACTOR:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  heapcare-test-postgres:
